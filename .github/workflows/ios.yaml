name: ios
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: swstl/ios-app
          token: ${{ secrets.APP_REPO_TOKEN }}
      - run: |
          APP=$(sed -n 's/^name: *//p' project.yml | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          swiftc $(grep -rL 'import SwiftUI' --include='*.swift' apps) checks/main.swift -o curlcheck && ./curlcheck
          brew install xcodegen
          xcodegen generate
          xcodebuild -quiet -project "$APP.xcodeproj" -scheme "$APP" -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir Payload
          cp -r "build/Build/Products/Release-iphoneos/$APP.app" Payload/
          zip -qr "$APP.ipa" Payload
      - run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$APP.ipa" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from ios-app $(git rev-parse --short HEAD)"
        env:
          GH_TOKEN: ${{ github.token }}
