name: ios
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project didrikstad.xcodeproj -scheme didrikstad -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/didrikstad.app Payload/
          zip -r didrikstad.ipa Payload
      - run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest didrikstad.ipa --target "$GITHUB_SHA" --title "Latest build" --notes "Built from $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
